# OpenShift deployment of ncrm-frontend.
#
# Option A - build in the cluster from git (BuildConfig + ImageStream below):
#   oc apply -f deploy/openshift/ncrm-frontend.yaml
#   oc start-build ncrm-frontend --follow
#
# Option B - use a prebuilt image from a registry: replace the Deployment
# image with e.g. quay.io/<org>/ncrm-frontend:1.x and delete the
# BuildConfig/ImageStream objects.
#
# The image runs as an arbitrary non-root UID (nginx-unprivileged, port 8080),
# so it needs no special SCC. Adjust BACKEND_URL to the backend Service name.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ncrm-frontend
  labels:
    app: ncrm-frontend
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ncrm-frontend
  labels:
    app: ncrm-frontend
spec:
  source:
    type: Git
    git:
      uri: https://github.com/jbenak8/ncrm-frontend.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
      buildArgs:
        - name: VITE_AUTH_MODE
          value: db
        # For Keycloak auth also set:
        # - name: VITE_AUTH_MODE
        #   value: keycloak
        # - name: VITE_KEYCLOAK_URL
        #   value: https://keycloak.example.com
        # - name: VITE_KEYCLOAK_REALM
        #   value: ncrm
        # - name: VITE_KEYCLOAK_CLIENT_ID
        #   value: ncrm-frontend
  output:
    to:
      kind: ImageStreamTag
      name: ncrm-frontend:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncrm-frontend
  labels:
    app: ncrm-frontend
  annotations:
    # Redeploy automatically when the ImageStream tag is updated by a build.
    image.openshift.io/triggers: |-
      [{"from":{"kind":"ImageStreamTag","name":"ncrm-frontend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"ncrm-frontend\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ncrm-frontend
  template:
    metadata:
      labels:
        app: ncrm-frontend
    spec:
      containers:
        - name: ncrm-frontend
          # Replaced by the trigger annotation above (or set a registry image here).
          image: image-registry.openshift-image-registry.svc:5000/change-me-namespace/ncrm-frontend:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BACKEND_URL
              # Kubernetes Service of the backend within the same namespace.
              value: http://ncrm-backend:8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ncrm-frontend
  labels:
    app: ncrm-frontend
spec:
  selector:
    app: ncrm-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ncrm-frontend
  labels:
    app: ncrm-frontend
spec:
  # host: ncrm.apps.example.com   # optional, otherwise generated by the cluster
  to:
    kind: Service
    name: ncrm-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
